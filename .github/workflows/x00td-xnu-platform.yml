          cat > dxb/patches/0026-sweet-boot-cpu-driver.patch <<'PATCH'
          diff --git a/iokit/Kernel/arm/SweetCPU.cpp b/iokit/Kernel/arm/SweetCPU.cpp
          new file mode 100644
          --- /dev/null
          +++ b/iokit/Kernel/arm/SweetCPU.cpp
          @@ -0,0 +1,171 @@
          +/*
          + * Single-CPU bring-up for sweet using XNU's legacy IOCPU interface.
          + * The architected timer and SGI1 already enter through pe_fiq/sleh_irq.
          + * Secondary CPU startup and system suspend require separate platform work.
          + */
          +#include <pexpert/arm64/board_config.h>
          +
          +#if defined(SWEET)
          +#include <IOKit/IOCPU.h>
          +#include <IOKit/IOLib.h>
          +#include <libkern/c++/OSData.h>
          +#include <libkern/c++/OSNumber.h>
          +#include <arm64/proc_reg.h>
          +#include <machine/atomic.h>
          +#include <kern/clock.h>
          +#include <kern/processor.h>
          +#include <mach/mach_time.h>
          +
          +class SweetCPU : public IOCPU {
          +	OSDeclareDefaultStructors(SweetCPU);
          +	const OSSymbol *cpuName = NULL;
          +
          +public:
          +	bool start(IOService *provider) APPLE_KEXT_OVERRIDE;
          +	void free(void) APPLE_KEXT_OVERRIDE;
          +	void initCPU(bool boot) APPLE_KEXT_OVERRIDE;
          +	void quiesceCPU(void) APPLE_KEXT_OVERRIDE;
          +	kern_return_t startCPU(vm_offset_t start_paddr, vm_offset_t arg_paddr) APPLE_KEXT_OVERRIDE;
          +	void haltCPU(void) APPLE_KEXT_OVERRIDE;
          +	void signalCPU(IOCPU *target) APPLE_KEXT_OVERRIDE;
          +	const OSSymbol *getCPUName(void) APPLE_KEXT_OVERRIDE;
          +};
          +
          +OSDefineMetaClassAndStructors(SweetCPU, IOCPU);
          +
          +bool
          +SweetCPU::start(IOService *provider)
          +{
          +	const ml_topology_info_t *topology = ml_get_topology_info();
          +	const ml_topology_cpu_t *cpu = topology->boot_cpu;
          +	OSNumber *logical = OSDynamicCast(OSNumber, provider->getProperty("logical-cpu-id"));
          +	OSData *reg = OSDynamicCast(OSData, provider->getProperty("reg"));
          +
          +	if (logical == NULL || reg == NULL || reg->getLength() != sizeof(uint32_t) ||
          +	    logical->unsigned32BitValue() != cpu->cpu_id ||
          +	    *(const uint32_t *)reg->getBytesNoCopy() != cpu->phys_id) {
          +		return false;
          +	}
          +	if (topology->num_cpus != 1) {
          +		panic("SWEET CPU: only single-CPU bring-up is supported");
          +	}
          +	if (!IOCPU::start(provider)) {
          +		return false;
          +	}
          +	cpuName = OSSymbol::withCStringNoCopy("Kryo 470");
          +	if (cpuName == NULL) {
          +		return false;
          +	}
          +	setCPUNumber(cpu->cpu_id);
          +
          +	ml_processor_info_t info = {};
          +	info.cpu_id = reinterpret_cast<cpu_id_t>(this);
          +	info.phys_id = cpu->phys_id;
          +	info.log_id = cpu->cpu_id;
          +	info.cluster_id = cpu->cluster_id;
          +	info.cluster_type = cpu->cluster_type;
          +	info.l2_cache_id = cpu->l2_cache_id;
          +	info.l2_cache_size = cpu->l2_cache_size;
          +	info.l3_cache_id = cpu->l3_cache_id;
          +	info.l3_cache_size = cpu->l3_cache_size;
          +	perfmon_interrupt_handler_func pmi_handler = NULL;
          +	kern_return_t result = ml_processor_register(&info, &machProcessor, &ipi_handler, &pmi_handler);
          +	if (result != KERN_SUCCESS) {
          +		panic("SWEET CPU: ml_processor_register failed: %d", result);
          +	}
          +	if (pmi_handler != NULL) {
          +		panic("SWEET CPU: PMI routing is not implemented");
          +	}
          +
          +	/* Re-enter the boot CPU through cpu_machine_init -> PE_cpu_machine_init. */
          +	result = processor_start(machProcessor);
          +	if (result != KERN_SUCCESS || getCPUState() != kIOCPUStateRunning) {
          +		panic("SWEET CPU: processor_start failed: %d", result);
          +	}
          +	ml_cpu_init_completed();
          +	cpusRunning();
          +	registerService();
          +	IOService::publishResource(gIOAllCPUInitializedKey, kOSBooleanTrue);
          +
          +	/* Announce completion only after registration, startup and SGI validation. */
          +	ml_set_max_cpus(topology->max_cpu_id + 1);
          +	IOLog("SWEET CPU: boot CPU %u registered, SGI1 verified, initialization complete\n",
          +	    getCPUNumber());
          +	return true;
          +}
          +
          +void
          +SweetCPU::free(void)
          +{
          +	OSSafeReleaseNULL(cpuName);
          +	IOCPU::free();
          +}
          +
          +void
          +SweetCPU::initCPU(bool boot)
          +{
          +	if (!boot) {
          +		panic("SWEET CPU: resume is not implemented");
          +	}
          +	assert(cpu_number() == (int)getCPUNumber());
          +	assert(ml_get_interrupts_enabled());
          +	ml_broadcast_cpu_event(CPU_BOOTED, getCPUNumber());
          +
          +	/* A real GIC interrupt clears SIGPdisabled in cpu_signal_handler. */
          +	uint64_t deadline;
          +	nanoseconds_to_deadline(NSEC_PER_SEC, &deadline);
          +	signalCPU(this);
          +	while (!ml_cpu_signal_is_enabled()) {
          +		if (mach_absolute_time() > deadline) {
          +			panic("SWEET CPU: SGI1 self-test timed out");
          +		}
          +		__asm__ volatile("yield");
          +	}
          +	setCPUState(kIOCPUStateRunning);
          +}
          +
          +void
          +SweetCPU::signalCPU(IOCPU *target)
          +{
          +	/* Only the boot CPU is registered by this driver. */
          +	if (target != this || cpu_number() != (int)getCPUNumber()) {
          +		panic("SWEET CPU: secondary CPU signalling is not implemented");
          +	}
          +	uint64_t mpidr = __builtin_arm_rsr64("MPIDR_EL1");
          +	unsigned int aff0 = mpidr & 0xff;
          +	if (aff0 >= 16) {
          +		panic("SWEET CPU: SGI target requires unsupported range selector");
          +	}
          +	uint64_t sgi = (((mpidr >> 32) & 0xff) << 48) |
          +	    (((mpidr >> 16) & 0xff) << 32) |
          +	    (((mpidr >> 8) & 0xff) << 16) |
          +	    ((uint64_t)SWEET_IPI_SGI << 24) | (1ULL << aff0);
          +	__builtin_arm_dsb(DSB_ISHST);
          +	__builtin_arm_wsr64("ICC_SGI1R_EL1", sgi);
          +	__builtin_arm_isb(ISB_SY);
          +}
          +
          +kern_return_t
          +SweetCPU::startCPU(vm_offset_t start_paddr __unused, vm_offset_t arg_paddr __unused)
          +{
          +	return KERN_NOT_SUPPORTED;
          +}
          +
          +void
          +SweetCPU::quiesceCPU(void)
          +{
          +	panic("SWEET CPU: CPU quiesce is not implemented");
          +}
          +
          +void
          +SweetCPU::haltCPU(void)
          +{
          +	panic("SWEET CPU: CPU halt/suspend is not implemented");
          +}
          +
          +const OSSymbol *
          +SweetCPU::getCPUName(void)
          +{
          +	return cpuName;
          +}
          +#endif /* SWEET */
          diff --git a/iokit/KernelConfigTables.cpp b/iokit/KernelConfigTables.cpp
          --- a/iokit/KernelConfigTables.cpp
          +++ b/iokit/KernelConfigTables.cpp
          @@ -41,6 +41,12 @@
               "     'IONameMatch'     = 'xiaomi,sweet';"
               "     'IOProbeScore'    = 10000:32;"
               "   },"
          +    "   {"
          +    "     'IOClass'         = SweetCPU;"
          +    "     'IOProviderClass' = IOPlatformDevice;"
          +    "     'IONameMatch'     = 'qcom,kryo470';"
          +    "     'IOProbeScore'    = 10000:32;"
          +    "   },"
           #endif
               "   {"
               "     'IOClass'         = IOPanicPlatform;"
          diff --git a/iokit/conf/files.arm64 b/iokit/conf/files.arm64
          --- a/iokit/conf/files.arm64
          +++ b/iokit/conf/files.arm64
          @@ -8,3 +8,5 @@
           
           # SWEET device-tree platform (empty translation unit on other boards)
           iokit/Kernel/arm/SweetPlatformExpert.cpp                         optional iokitcpp
          +
          +iokit/Kernel/arm/SweetCPU.cpp                                    optional iokitcpp
          PATCH
          printf '%s\n' '06de6e84d8ff9b0307872fb78a827e84fc1e16a1b7286a87f0e618a5dc2692a9  dxb/patches/0026-sweet-boot-cpu-driver.patch' | shasum -a 256 -c -

          cat > dxb/patches/0141-sapphire-iorpc-kernelcontent.patch <<'PATCH'
          From c9c3ee8f11bcc2a372b70dee421c3719577dbe73 Mon Sep 17 00:00:00 2001
          From: x <x@x>
          Date: Tue, 20 Oct 2026 06:46:08 +0000
          Subject: [PATCH] sapphire-0141: IORPC.kernelContent for Xcode 16+ iig
          
          Newer iig dispatch stubs take the decoded IORPCMessage from
          IORPC.kernelContent (added in later xnu); xnu-8796 has no such field.
          Add it (kernel only) and fill it where the kernel builds an IORPC from
          a user message, as later xnu does, so the kernel builds with the
          Xcode 16 that hosted macOS CI still offers.
          ---
           iokit/DriverKit/IORPC.h       | 5 +++++
           iokit/IOKit/IORPC.h           | 5 +++++
           iokit/Kernel/IOUserServer.cpp | 3 ++-
           3 files changed, 12 insertions(+), 1 deletion(-)
          
          diff --git a/iokit/DriverKit/IORPC.h b/iokit/DriverKit/IORPC.h
          index 3ded78c..c95c58c 100644
          --- a/iokit/DriverKit/IORPC.h
          +++ b/iokit/DriverKit/IORPC.h
          @@ -224,6 +224,11 @@ struct IORPC {
           	IORPCMessageMach * reply;
           	uint32_t           sendSize;
           	uint32_t           replySize;
          +#ifdef KERNEL
          +	/* sapphire: newer iig (Xcode 16+) dispatch stubs read the decoded
          +	 * message from here instead of calling IORPCMessageFromMach() */
          +	IORPCMessage     * kernelContent;
          +#endif /* KERNEL */
           };
           typedef struct IORPC IORPC;
           
          diff --git a/iokit/IOKit/IORPC.h b/iokit/IOKit/IORPC.h
          index 3ded78c..c95c58c 100644
          --- a/iokit/IOKit/IORPC.h
          +++ b/iokit/IOKit/IORPC.h
          @@ -224,6 +224,11 @@ struct IORPC {
           	IORPCMessageMach * reply;
           	uint32_t           sendSize;
           	uint32_t           replySize;
          +#ifdef KERNEL
          +	/* sapphire: newer iig (Xcode 16+) dispatch stubs read the decoded
          +	 * message from here instead of calling IORPCMessageFromMach() */
          +	IORPCMessage     * kernelContent;
          +#endif /* KERNEL */
           };
           typedef struct IORPC IORPC;
           
          diff --git a/iokit/Kernel/IOUserServer.cpp b/iokit/Kernel/IOUserServer.cpp
          index 5d1d922..1406bef 100644
          --- a/iokit/Kernel/IOUserServer.cpp
          +++ b/iokit/Kernel/IOUserServer.cpp
          @@ -3209,7 +3209,7 @@ IOUserServer::server(ipc_kmsg_t requestkmsg, ipc_kmsg_t * pReply)
           		msgout = (typeof(msgout))ikm_header(replykmsg);
           	}
           
          -	IORPC rpc = { .message = msgin, .reply = msgout, .sendSize = msgin->msgh.msgh_size, .replySize = replyAlloc };
          +	IORPC rpc = { .message = msgin, .reply = msgout, .sendSize = msgin->msgh.msgh_size, .replySize = replyAlloc, .kernelContent = message };
           
           	if (object) {
           		kern_allocation_name_t prior;
          @@ -3358,6 +3358,7 @@ IOUserServerUEXTTrap(OSObject * object, void * p1, void * p2, void * p3, void *
           	rpc.sendSize  = mach->msgh.msgh_size;
           	rpc.reply     = (IORPCMessageMach *) (p + inSize);
           	rpc.replySize = ((uint32_t) (sizeof(buffer.buffer) - inSize));    // inSize was checked
          +	rpc.kernelContent = message;
           
           	message->objects[0] = 0;
           	if ((action = OSDynamicCast(OSAction, object))) {
          -- 
          2.43.0

          PATCH
          printf '%s\n' '781e1c06cbfe8c199f4c4bc86842338ba99a3684b6261c9d2987ccd9b32c3906  dxb/patches/0141-sapphire-iorpc-kernelcontent.patch' | shasum -a 256 -c -

          python3 - <<'PY'
          from pathlib import Path

          script = Path("dxb/build.sh")
          text = script.read_text()
          library_line = next(line for line in text.splitlines()
                              if "xcodebuild install -target libfirehose_kernel " in line)
          assert library_line.count('ARCHS="x86_64 arm64e"') == 2
          baseline_library = library_line.replace('ARCHS="x86_64 arm64e"', 'ARCHS="arm64"')
          baseline_flags = "-march=armv8-a+crypto -mcpu=cortex-a53 -mno-outline-atomics -Xclang -target-feature -Xclang -lse -Xclang -target-feature -Xclang -rcpc"
          baseline_library += " 'OTHER_CFLAGS=$(inherited) " + baseline_flags + "'"
          baseline_library += " 'OTHER_CPLUSPLUSFLAGS=$(inherited) " + baseline_flags + "'"
          text = text.replace(library_line, baseline_library)
          warning = '                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"'
          replacement = '''                case "$(basename "$PATCH")" in
                              [0-9][0-9][0-9][0-9]-*)
                                  error "Required X00TD patch failed: ${PATCH}: ${APPLY_CHECK}"
                                  exit 1
                                  ;;
                              *)
                                  warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"
                                  ;;
                          esac'''
          assert text.count(warning) == 1, "Pinned patch loop changed"
          text = text.replace(warning, replacement)
          hook = '    patches\n    venv\n'
          assert text.count(hook) == 1, "Pinned build entry points changed"
          text = text.replace(hook, '    patches\n    python3 "${WORK_DIR}/x00td-board-preflight.py"\n    venv\n')
          script.write_text(text)
          PY

          cat > dxb/x00td-board-preflight.py <<'PY'
          from pathlib import Path
          import re
          import subprocess
          
          root = Path(__file__).resolve().parent
          output = root.parent / "preflight"
          output.mkdir(exist_ok=True)
          tables_path = root / "xnu/iokit/KernelConfigTables.cpp"
          tables = tables_path.read_text()
          assert tables.count("'xiaomi,sweet'") == 1
          assert tables.count("'qcom,kryo470'") == 1
          tables = tables.replace("'xiaomi,sweet'", "'asus,x00td'")
          tables = tables.replace("'qcom,kryo470'", "'qcom,sdm636'")
          tables_path.write_text(tables)
          platform_path = root / "xnu/iokit/Kernel/arm/SweetPlatformExpert.cpp"
          platform = platform_path.read_text()
          assert platform.count('strlcpy(name, "sweet",') == 1
          assert platform.count('strlcpy(name, "Redmi Note 10 Pro",') == 1
          platform = platform.replace('strlcpy(name, "sweet",', 'strlcpy(name, "X00TD",')
          platform = platform.replace('strlcpy(name, "Redmi Note 10 Pro",', 'strlcpy(name, "ASUS ZenFone Max Pro M1",')
          platform_path.write_text(platform)
          cpu_path = root / "xnu/iokit/Kernel/arm/SweetCPU.cpp"
          cpu = cpu_path.read_text().replace('"Kryo 470"', '"Kryo 260"')
          cpu_path.write_text(cpu)
          for name in ("SweetPlatformExpert.cpp", "SweetCPU.cpp"):
              assert name in (root / "xnu/iokit/conf/files.arm64").read_text()
          zones = (root / "xnu/osfmk/kern/zalloc.c").read_text(encoding="utf-8")
          assert "#if XNU_PLATFORM_MacOSX && !defined(ARM64_BOARD_CONFIG_SWEET)\n#define ZONE_MAP_MAX" in zones, "Missing compact zone-map patch"
          copyio = (root / "xnu/osfmk/arm64/copyio.c").read_text()
          helpers = re.findall(
              r"static inline void\s+user_access_(?:enable|disable)\(void\)\s*\{.*?\n\}",
              copyio, re.S,
          )
          assert len(helpers) == 2, "Expected both original XNU user-access helpers"
          probe = output / "board-probe.c"
          source = """#include <pexpert/arm64/SWEET.h>
          #if __ARM_PAN_AVAILABLE__
          #error Baseline X00TD must use the configuration without hardware PAN
          #endif
          #ifdef __ARM_16K_PG__
          #error X00TD requires 4 KiB translation tables
          #endif
          #define assert(expression) do { if (!(expression)) __builtin_trap(); } while (0)
          """
          zone_policy = re.search(
              r"(?m)^#if XNU_PLATFORM_MacOSX && !defined\(ARM64_BOARD_CONFIG_SWEET\)\n#define ZONE_MAP_MAX.*?^#endif[^\n]*",
              zones, re.S,
          )
          assert zone_policy, "Cannot locate zone sizing policy"
          source += "\n#define XNU_PLATFORM_MacOSX 1\n" + zone_policy.group(0) + "\n"
          source += '_Static_assert(ZONE_MAP_VA_SIZE == (24ULL << 30), "Wrong X00TD zone reservation");\n'
          source += '_Static_assert(ZONE_MAP_MAX == (8ULL << 30), "Wrong X00TD zone limit");\n'
          source += "\n".join(helpers)
          source += "\nvoid x00td_board_probe(void) { user_access_enable(); user_access_disable(); }\n"
          probe.write_text(source)
          flags = [
              "-target", "arm64-apple-macos15.5", "-arch", "arm64",
              "-DARM64_BOARD_CONFIG_SWEET",
              "-march=armv8-a+crypto", "-mcpu=cortex-a53", "-mno-outline-atomics",
              "-Xclang", "-target-feature", "-Xclang", "-lse",
              "-O0", "-ffreestanding", "-fno-stack-protector",
              "-I", str(root / "xnu/pexpert"),
          ]
          subprocess.run(["xcrun", "clang", *flags, "-S", str(probe),
                          "-o", str(output / "board-probe.s")], check=True)
          assembly = (output / "board-probe.s").read_text()
          assert not re.search(r"\bpan\b", assembly), "Board probe still uses PAN"
          print("PASS: the patched board header and original XNU copyio helpers compile for baseline ARMv8-A.")
          commpage = root / "xnu/osfmk/arm/commpage/commpage_asm.s"
          assembly_flags = flags + [
              "-DARM64_BOARD_CONFIG_SWEET", "-DASSEMBLER", "-D__ASSEMBLER__",
              "-I", str(root / "xnu/osfmk"), "-x", "assembler-with-cpp",
          ]
          subprocess.run(["xcrun", "clang", *assembly_flags, "-c", str(commpage),
                          "-o", str(output / "commpage-baseline.o")], check=True)
          print("PASS: the complete patched commpage assembly compiles with LSE disabled.")
          PY

      - name: Build XNU
        working-directory: dxb
        shell: bash
        run: |
          set -euo pipefail
          if bash build.sh > ../x00td-build.log 2>&1; then
            tail -n 20 ../x00td-build.log
          else
          python3 - <<'PY'
          import re
          from collections import deque
          from pathlib import Path

          errors = deque(maxlen=30)
          tail = deque(maxlen=30)
          with Path("../x00td-build.log").open(errors="replace") as log:
              for number, line in enumerate(log, 1):
                  tail.append((number, line.rstrip()))
                  if re.search(r"fatal error:|: error:|undefined symbols|Error [1-9]|BUILD FAILED", line, re.I):
                      errors.append((number, line.rstrip()))
          for number, line in errors:
              print(f"{number}: {line[:2000]}")
          for number, line in tail:
              print(f"{number}: {line[:2000]}")
          PY
            exit 1
          fi

      - name: Verify the X00TD changes and collect the kernel
        shell: bash
        run: |
          set -euo pipefail
          grep -F '0x9d400000 + 2128 * 4320' dxb/xnu/osfmk/arm64/start.s
          grep -F 'EARLY_HEIGHT 2160u' dxb/xnu/osfmk/arm64/sweet_early.c
          if grep -E '^#define[[:space:]]+__ARM_16K_PG__' dxb/xnu/pexpert/pexpert/arm64/SWEET.h; then
            exit 1
          fi
          grep -F 'Lx00td_fb_map_next:' dxb/xnu/osfmk/arm64/start.s
          grep -F 'MACHINE_FLAGS_ARM64_SWEET = -DARM64_BOARD_CONFIG_SWEET                -march=armv8-a+crypto' dxb/xnu/makedefs/MakeInc.def
          grep -F 'sweet_early_relocate(SWEET_EARLY_FB_VA);' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -F '#define X00TD_FB_BLOCKS 5u' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -F 'CFLAGS_ARM64 += -mcpu=cortex-a53 -mno-outline-atomics -Xclang -target-feature -Xclang -lse' dxb/xnu/makedefs/MakeInc.def
          grep -F 'kernelContent' dxb/xnu/iokit/IOKit/IORPC.h
          kernel=dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          test -s "$kernel"
          xcrun lipo "$kernel" -verify_arch arm64
          python3 - "$kernel" <<'PY'
          import struct
          import sys
          from pathlib import Path

          kernel = Path(sys.argv[1]).read_bytes()
          from hashlib import sha256

          old_kernel = "0385193011e245defa788e4066831da3f37868c17cef72f293feb26b0fcb3fa8"
          assert sha256(kernel).hexdigest() != old_kernel, "Kernel still matches the previous LSE build"
          assert struct.unpack_from("<I", kernel)[0] == 0xfeedfacf, "Expected a thin Mach-O"
          assert b"SweetPlatformExpert" in kernel, "Missing platform expert class"
          assert b"SweetCPU" in kernel, "Missing CPU driver class"
          assert b"SWEET PRNG: HMAC-SHA256 registered" in kernel, "Missing kernel HMAC PRNG"
          assert b"ASUS ZenFone Max Pro M1" in kernel, "Missing X00TD platform identity"
          assert b"X00TD ZMAP v17: claim" in kernel, "Missing v17 zone diagnostics"
          assert b"X00TD ZMAP v17: claims exceed largest hole" in kernel, "Missing claim bounds diagnostic"
          count, = struct.unpack_from("<I", kernel, 16)
          offset = 32
          for _ in range(count):
              command, size = struct.unpack_from("<II", kernel, offset)
              if command == 0x19 and kernel[offset + 8:offset + 24].rstrip(b"\0") == b"__TEXT":
                  address, = struct.unpack_from("<Q", kernel, offset + 24)
                  assert address == 0xfffffff007004000, f"Unexpected XNU link address {address:#x}"
                  break
              offset += size
          else:
              raise SystemExit("Missing Mach-O __TEXT segment")
          PY
          python3 - "$kernel" <<'PY'
          import struct
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          offset = 32
          segments = []
          instruction_ranges = []
          symbol_table = None
          for _ in range(struct.unpack_from("<I", data, 16)[0]):
              command, size = struct.unpack_from("<II", data, offset)
              if command == 0x19:
                  _, va, memory_size, file_offset, file_size = struct.unpack_from("<16s4Q", data, offset + 8)
                  segments.append((va, file_offset, file_size))
                  if data[offset + 8:offset + 24].rstrip(b"\0") == b"__TEXT_EXEC":
                      number, = struct.unpack_from("<I", data, offset + 64)
                      for index in range(number):
                          section = offset + 72 + index * 80
                          section_va, length, section_file = struct.unpack_from("<QQI", data, section + 32)
                          instruction_ranges.append((section_va, section_file, length))
              elif command == 2:
                  symbol_table = struct.unpack_from("<4I", data, offset + 8)
              offset += size
          assert symbol_table, "Missing kernel symbol table"
          start, count, strings, string_size = symbol_table
          symbols = []
          for index in range(count):
              name, kind, section, description, address = struct.unpack_from("<IBBHQ", data, start + index * 16)
              if name < string_size and kind & 0x0e == 0x0e:
                  end = data.index(b"\0", strings + name)
                  symbols.append((address, data[strings + name:end]))
          symbols.sort()
          # Reject LSE/CAS/RCpc across executable sections, including linked
          # libraries. K256 is an embedded 256-byte SHA table, not code.
          constants = [(address, address + 256) for address, name in symbols
                       if name in (b"K256", b"_K256")]
          failures = []
          for va, file_offset, length in instruction_ranges:
              for position in range(0, length - 3, 4):
                  address = va + position
                  if any(low <= address < high for low, high in constants):
                      continue
                  word, = struct.unpack_from("<I", data, file_offset + position)
                  if (word & 0x3f200c00 == 0x38200000 or
                      word & 0x3fa07c00 in (0x08a07c00, 0x08207c00)):
                      failures.append((hex(address), hex(word)))
          assert not failures, f"Unsupported atomic/RCpc instructions remain: {failures[:20]}"
          print("PASS: all executable sections are free of LSE/CAS/RCpc instructions.")
          for index, (address, name) in enumerate(symbols):
              if name == b"_lck_grp_reference":
                  end = next(value for value, _ in symbols[index + 1:] if value > address)
                  for va, file_offset, file_size in segments:
                      if va <= address < end <= va + file_size:
                          code = data[file_offset + address - va:file_offset + end - va]
                          instructions = struct.unpack("<" + "I" * (len(code) // 4), code)
                          assert not any(word & 0x3f200c00 == 0x38200000 for word in instructions), "LSE atomic remains in lck_grp_reference"
                          print("PASS: lck_grp_reference uses no LSE load/store atomic instruction.")
                          break
                  else:
                      raise SystemExit("Function is outside file-backed kernel segments")
                  break
          else:
              raise SystemExit("Missing lck_grp_reference symbol")
          PY
          mkdir -p out
          cp "$kernel" out/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          info = {
              "workflow": "X00TD platform and CPU build",
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "compiler_target": "armv8-a+crypto",
              "cpu": "cortex-a53",
              "lse_disabled": True,
              "hardware_pan": False,
              "commpage_baseline_atomics": True,
              "persistent_console": True,
              "source_kmem_rng": True,
              "source_kernel_hmac_prng": True,
              "trust_cache_service": "unavailable",
              "platform_match": "asus,x00td",
              "cpu_match": "qcom,sdm636",
              "timer_intid_from_adt": True,
              "linked_library_baseline": True,
              "zone_map_va_bytes": 24 << 30,
              "zone_map_max_bytes": 8 << 30,
              "translation_page_bytes": 4096,
          }
          Path("out/BUILD_INFO.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
          (cd out && shasum -a 256 kernel.development.sweet > SHA256SUMS)

      - name: Compress the build log
        if: always()
        shell: bash
        run: |
          if [ -f x00td-build.log ]; then
            gzip -f x00td-build.log
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x00td-platform-build-diagnostics
          path: |
            preflight/
            x00td-build.log.gz
            dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the kernel and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x00td-xnu-platform-kernel
          path: out/
          if-no-files-found: error
          retention-days: 14

