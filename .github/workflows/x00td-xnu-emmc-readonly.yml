          diff --git a/bsd/dev/x00td_emmc_readonly.h b/bsd/dev/x00td_emmc_readonly.h
          new file mode 100644
          --- /dev/null
          +++ b/bsd/dev/x00td_emmc_readonly.h
          @@ -0,0 +1,21 @@
          +/* X00TD diagnostic only: no block-device registration or storage write API. */
          +#ifndef X00TD_EMMC_READONLY_H
          +#define X00TD_EMMC_READONLY_H
          +#include <stdint.h>
          +#include <stddef.h>
          +struct xe_io {
          +    void *context;
          +    uint32_t (*read32)(void *, uint32_t);
          +    void (*write32)(void *, uint32_t, uint32_t);
          +    uint64_t (*now_us)(void *);
          +    void (*delay_us)(void *, unsigned);
          +};
          +struct xe_result { uint32_t stage, status, present, response, words, command; };
          +enum { XE_OK=0, XE_POLICY=1, XE_BUSY=2, XE_TIMEOUT=3, XE_CONTROLLER=4,
          +       XE_CARD=5, XE_SHORT=6, XE_HANDOFF=7, XE_MISMATCH=8 };
          +/* The only legal operations: CMD13 RCA1; CMD8 argument0; CMD17 LBA0..18. */
          +int xe_command(const struct xe_io *, unsigned, uint32_t, uint8_t *, size_t,
          +               struct xe_result *);
          +int xe_handoff(const struct xe_io *, struct xe_result *);
          +void xe_sha256(const uint8_t *, size_t, uint8_t[32]);
          +#endif
          diff --git a/bsd/dev/x00td_emmc_readonly.c b/bsd/dev/x00td_emmc_readonly.c
          new file mode 100644
          --- /dev/null
          +++ b/bsd/dev/x00td_emmc_readonly.c
          @@ -0,0 +1,110 @@
          +/*
          + * X00TD read-only SDCC v5 diagnostic.
          + * Protocol references: N1709/ios-whyred2 drivers/storage/santoni_sdhci.c,
          + * revision recorded in REFERENCE.json. In particular: HC offset0, atomic
          + * 32-bit command/transfer write, and per-word PRESENT_STATE FIFO gating.
          + * This deliberately excludes that driver's enumeration, timing changes,
          + * DMA, retries, BSD write paths and persistent console logger.
          + */
          +#include "x00td_emmc_readonly.h"
          +#define R(o) io->read32(io->context,(o))
          +#define W(o,v) io->write32(io->context,(o),(v))
          +#define NOW() io->now_us(io->context)
          +#define WAIT() io->delay_us(io->context,1)
          +#define ERRORS 0x03ff8000u
          +static int status(const struct xe_io *io,struct xe_result *r) {
          +    r->status=R(0x30);r->present=R(0x24);
          +    return (r->status&ERRORS)?XE_CONTROLLER:XE_OK;
          +}
          +int xe_handoff(const struct xe_io *io,struct xe_result *r) {
          +    r->stage=1;r->words=0;r->response=0;r->command=0;
          +    if(status(io,r))return XE_CONTROLLER;
          +    /* Require an enabled, stable, gated-on card clock; change no power/timing. */
          +    if((R(0x2c)&7)!=7)return XE_HANDOFF;
          +    if(r->present&(3u|0x300u|0x800u))return XE_BUSY;
          +    return XE_OK;
          +}
          +int xe_command(const struct xe_io *io,unsigned cmd,uint32_t arg,
          +               uint8_t *out,size_t bytes,struct xe_result *r) {
          +    const int data=(cmd==8||cmd==17);
          +    /* Enforce at the final command boundary, before any MMIO access. */
          +    if(!((cmd==13 && arg==0x10000 && !out && bytes==0) ||
          +         (cmd==8 && arg==0 && out && bytes==512) ||
          +         (cmd==17 && arg<19 && out && bytes==512)))return XE_POLICY;
          +    r->stage=2;r->words=0;r->response=0;r->command=cmd;
          +    if(status(io,r))return XE_CONTROLLER;
          +    if(r->present&(3u|0x300u|0x800u))return XE_BUSY;
          +    uint32_t old_int=R(0x34),old_signal=R(0x38),old_block=R(0x04);
          +    /* Poll status only, with CPU IRQ signalling suppressed during the command. */
          +    W(0x38,0);W(0x34,old_int|0x03ff8033u);W(0x30,0xffffffffu);
          +    if(data)W(0x04,0x00010200u);
          +    W(0x08,arg);
          +    uint32_t flags=data?0x3au:0x1au;
          +    W(0x0c,((cmd<<8|flags)<<16)|(data?0x12u:0));
          +    uint64_t begin=NOW();int error=XE_OK;
          +    for(;;){
          +        if((error=status(io,r)))goto done;
          +        if(r->status&1u)break;
          +        if(NOW()-begin>=100000u){error=XE_TIMEOUT;goto done;}
          +        WAIT();
          +    }
          +    W(0x30,1);r->response=R(0x10);
          +    if(r->response&0xfdffe080u){error=XE_CARD;goto done;}
          +    if(!data){
          +        if(((r->response>>9)&15)!=4 || !(r->response&0x100))error=XE_HANDOFF;
          +        goto done;
          +    }
          +    r->stage=3;begin=NOW();
          +    for(unsigned n=0;n<128;n++){
          +        for(;;){
          +            if((error=status(io,r)))goto done;
          +            if(r->present&0x800u)break;
          +            if(r->status&2u){error=XE_SHORT;goto done;}
          +            if(NOW()-begin>=2000000u){error=XE_TIMEOUT;goto done;}
          +            WAIT();
          +        }
          +        uint32_t word=R(0x20);
          +        for(unsigned j=0;j<4;j++)out[n*4+j]=(uint8_t)(word>>(j*8));
          +        r->words=n+1;
          +    }
          +    W(0x30,0x20u);r->stage=4;
          +    for(;;){
          +        if((error=status(io,r)))goto done;
          +        /* An idle PRESENT_STATE alone is never treated as successful completion. */
          +        if(r->status&2u)break;
          +        if(NOW()-begin>=2000000u){error=XE_TIMEOUT;goto done;}
          +        WAIT();
          +    }
          +    W(0x30,2u);
          +done:
          +    /* Restore masks and block settings. Never reset a failed card/controller. */
          +    W(0x30,r->status);W(0x04,old_block);W(0x34,old_int);W(0x38,old_signal);
          +    return error;
          +}
          +/* SHA-256 for the bounded diagnostic bytes; checked against hashlib in tests. */
          +static uint32_t rr(uint32_t x,unsigned n){return (x>>n)|(x<<(32-n));}
          +static void compress(uint32_t h[8],const uint8_t b[64]) {
          +    static const uint32_t k[64]={
          +      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
          +      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
          +      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
          +      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
          +      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
          +      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
          +      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
          +      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2};
          +    uint32_t w[64];for(unsigned i=0;i<16;i++)w[i]=(uint32_t)b[4*i]<<24|(uint32_t)b[4*i+1]<<16|(uint32_t)b[4*i+2]<<8|b[4*i+3];
          +    for(unsigned i=16;i<64;i++)w[i]=w[i-16]+(rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>3))+w[i-7]+(rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>10));
          +    uint32_t a=h[0],c=h[2],b0=h[1],d=h[3],e=h[4],f=h[5],g=h[6],v=h[7];
          +    for(unsigned i=0;i<64;i++){uint32_t t=v+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+k[i]+w[i];uint32_t t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&b0)^(a&c)^(b0&c));v=g;g=f;f=e;e=d+t;d=c;c=b0;b0=a;a=t+t2;}
          +    h[0]+=a;h[1]+=b0;h[2]+=c;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=v;
          +}
          +void xe_sha256(const uint8_t *data,size_t n,uint8_t out[32]) {
          +    uint32_t h[8]={0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19};
          +    size_t original=n;while(n>=64){compress(h,data);data+=64;n-=64;}
          +    uint8_t tail[128]={0};for(size_t i=0;i<n;i++)tail[i]=data[i];tail[n]=0x80;
          +    size_t total=n<56?64:128;uint64_t bits=(uint64_t)original*8;
          +    for(unsigned i=0;i<8;i++)tail[total-1-i]=(uint8_t)(bits>>(8*i));
          +    compress(h,tail);if(total==128)compress(h,tail+64);
          +    for(unsigned i=0;i<32;i++)out[i]=(uint8_t)(h[i/4]>>(24-8*(i%4)));
          +}
