          +/* Kernel adapter for the bounded X00TD-only SDCC v5 read diagnostic. */
          +#include <sys/types.h>
          +#include <sys/systm.h>
          +#include <kern/clock.h>
          +#include <mach/vm_param.h>
          +#include <pexpert/pexpert.h>
          +#include <pexpert/device_tree.h>
          +#include "x00td_emmc_readonly.h"
          +#include "x00td_emmc_expected.h"
          +extern vm_offset_t ml_io_map(vm_offset_t,vm_size_t);
          +struct xe_kernel { volatile uint32_t *hc; };
          +static uint8_t captured[XE_GPT_BYTES];
          +static uint32_t rd(void *p,uint32_t off){struct xe_kernel *k=p;uint32_t v=k->hc[off/4];__asm__ volatile("dmb oshld" ::: "memory");return v;}
          +static void wr(void *p,uint32_t off,uint32_t v){struct xe_kernel *k=p;k->hc[off/4]=v;__asm__ volatile("dsb oshst" ::: "memory");}
          +static uint64_t now(void *p){(void)p;uint64_t ns;absolutetime_to_nanoseconds(mach_absolute_time(),&ns);return ns/1000;}
          +static void pause_us(void *p,unsigned n){(void)p;delay(n);}
          +static void digest_print(const uint8_t d[32]){for(unsigned i=0;i<32;i++)printf("%02x",d[i]);printf("\n");}
          +static int equal(const uint8_t a[32],const uint8_t b[32]){unsigned v=0;for(unsigned i=0;i<32;i++)v|=a[i]^b[i];return v==0;}
          +static uint32_t le32(const uint8_t *p){return (uint32_t)p[0]|(uint32_t)p[1]<<8|(uint32_t)p[2]<<16|(uint32_t)p[3]<<24;}
          +void x00td_emmc_readonly_probe(void) {
          +    int enable=0;static int attempted;
          +    if(!PE_parse_boot_argn("x00td_emmc_probe",&enable,sizeof(enable)) || enable!=1 || attempted)return;
          +    attempted=1;printf("X00TD EMMC RO: start; storage command allowlist 8/13/17\n");
          +    DTEntry entry;const uint64_t *reg;unsigned int size=0;
          +    if(SecureDTLookupEntry(NULL,"/x00td-emmc",&entry)!=kSuccess ||
          +       SecureDTGetProperty(entry,"reg",(const void **)&reg,&size)!=kSuccess || size!=32 ||
          +       reg[0]!=0x0c0c4000 || reg[1]!=0x1000 || reg[2]!=0x0c0c5000 || reg[3]!=0x1000){
          +        printf("X00TD EMMC RO: FAIL device-tree controller binding\n");return;
          +    }
          +    struct xe_kernel context={0};context.hc=(volatile uint32_t *)ml_io_map(reg[0],reg[1]);
          +    if(!context.hc){printf("X00TD EMMC RO: FAIL MMIO mapping\n");return;}
          +    struct xe_io io={&context,rd,wr,now,pause_us};struct xe_result r={0};
          +    /* SDCC v5 has native HC registers at offset0. Do not use the v4
          +     * CORE_HC_MODE gate or its HC+0x900 register window. */
          +    uint32_t version=rd(&context,0xfc)>>16;
          +    printf("X00TD EMMC RO: VERSION=%04x CLOCK=%08x HOST=%08x STATE=%08x\n",version,rd(&context,0x2c),rd(&context,0x28),rd(&context,0x24));
          +    int error=xe_handoff(&io,&r);
          +    if(!version || version==0xffff)error=XE_HANDOFF;
          +    if(error)goto failed;
          +    error=xe_command(&io,13,0x10000,NULL,0,&r);if(error)goto failed;
          +    uint8_t ext[512];error=xe_command(&io,8,0,ext,sizeof(ext),&r);if(error)goto failed;
          +    uint32_t sectors=le32(ext+212);
          +    printf("X00TD EMMC RO: EXT_CSD revision=%u sectors=%u\n",ext[192],sectors);
          +    if(ext[192]<1 || ext[192]>8 || sectors!=XE_EXPECTED_SECTORS){error=XE_MISMATCH;goto failed;}
          +    for(unsigned pass=0;pass<2;pass++){
          +        for(unsigned lba=0;lba<XE_GPT_BYTES/512;lba++){
