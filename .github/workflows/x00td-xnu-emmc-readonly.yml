          +            if(error){printf("X00TD EMMC RO: pass=%u lba=%u\n",pass+1,lba);goto failed;}
          +        }
          +        uint8_t digest[32];xe_sha256(captured,sizeof(captured),digest);
          +        printf("X00TD EMMC RO: GPT pass=%u SHA256=",pass+1);digest_print(digest);
          +        if(!equal(digest,xe_expected_gpt_sha256)){error=XE_MISMATCH;goto failed;}
          +    }
          +    printf("X00TD EMMC RO PASS: 2 x %u sectors match saved GPT SHA256; no storage writes\n",XE_GPT_BYTES/512);
          +    return;
          +failed:
          +    printf("X00TD EMMC RO FAIL: error=%d stage=%u cmd=%u words=%u R1=%08x INT=%08x STATE=%08x\n",error,r.stage,r.command,r.words,r.response,r.status,r.present);
          +    printf("X00TD EMMC RO: stopped; no retry/reset/timing changes; RAM-root boot continues\n");
          +}
