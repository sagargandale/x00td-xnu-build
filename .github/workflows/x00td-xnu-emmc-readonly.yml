          +/* Read-only X00TD RAM archive v1. All integers are little endian. */
          +#ifndef X00TD_RAMFS_FORMAT_H
          +#define X00TD_RAMFS_FORMAT_H
          +#define XR_TABLE_BYTES 16384u
          +#define XR_RECORD_BYTES 128u
          +#define XR_MAX_FILES 127u
          +static unsigned xr32(const unsigned char *p)
          +{ return p[0] | (unsigned)p[1]<<8 | (unsigned)p[2]<<16 | (unsigned)p[3]<<24; }
          +static unsigned long long xr64(const unsigned char *p)
          +{ return xr32(p) | (unsigned long long)xr32(p+4)<<32; }
          +static int xr_equal(const unsigned char *a,const unsigned char *b,unsigned n)
          +{ while(n--) if(*a++ != *b++) return 0; return 1; }
          +/* Return 0 for valid archive, 1 for legacy payload, -1 for corrupt archive. */
          +static int xr_validate(const unsigned char *table,unsigned long long device_bytes)
          +{
          + static const unsigned char magic[8]={'X','0','0','R','A','M','1',0};
          + unsigned count=xr32(table+8); unsigned long long end=XR_TABLE_BYTES;
          + if(!xr_equal(table,magic,8)) return 1;
          + if(xr32(table+12)!=1 || !count || count>XR_MAX_FILES ||
          +    xr64(table+16)>device_bytes || xr64(table+16)<XR_TABLE_BYTES ||
          +    xr64(table+16)%4096) return -1;
          + for(unsigned i=0;i<count;i++) {
          +  const unsigned char *p=table+(i+1)*XR_RECORD_BYTES;
          +  unsigned len=0; while(len<96 && p[len])len++;
          +  unsigned type=xr32(p+112);
          +  unsigned long long off=xr64(p+96),size=xr64(p+104);
          +  if(!len || len==96 || p[0]=='/' || p[len-1]=='/' || (type!=1 && type!=2))return -1;
          +  unsigned last=0;
          +  for(unsigned n=0;n<=len;n++) if(n==len || p[n]=='/') {
          +   unsigned part=n-last;
          +   if(!part || (part==1 && p[last]=='.') ||
          +      (part==2 && p[last]=='.' && p[last+1]=='.'))return -1;
          +   if(n<len) {
          +    int parent=0;
          +    for(unsigned j=0;j<i;j++) {
          +     const unsigned char *q=table+(j+1)*XR_RECORD_BYTES;
          +     if(xr32(q+112)==2 && xr_equal(p,q,n) && q[n]==0)parent=1;
          +    }
