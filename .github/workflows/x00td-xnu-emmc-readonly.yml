name: X00TD read-only eMMC diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOS_VERSION: "13.5"
      KERNEL_CONFIG: DEVELOPMENT
      ARCH_CONFIG: ARM64
      MACHINE_CONFIG: SWEET
    steps:
      - name: Check Xcode atomic code generation and install tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --find iig
          mkdir -p preflight
          cat > preflight/atomic-probe.c <<'C'
          #if defined(__ARM_FEATURE_ATOMICS)
          #error LSE must be disabled for X00TD
          #endif
          unsigned add(unsigned *p) {
              return __atomic_fetch_add(p, 1u, __ATOMIC_RELAXED);
          }
          unsigned exchange(unsigned *p) {
              return __atomic_exchange_n(p, 1u, __ATOMIC_ACQ_REL);
          }
          _Bool compare_exchange(unsigned *p, unsigned *expected, unsigned desired) {
              return __atomic_compare_exchange_n(p, expected, desired, 0,
                                                 __ATOMIC_ACQ_REL, __ATOMIC_RELAXED);
          }
          C
          xcrun clang -target arm64-apple-macos15.5 -arch arm64 \
            -march=armv8-a+crypto -mcpu=cortex-a53 -mno-outline-atomics \
            -Xclang -target-feature -Xclang -lse \
            -O2 -ffreestanding -fno-stack-protector \
            -S preflight/atomic-probe.c -o preflight/atomic-probe.s
          python3 - <<'PY'
          import re
          from pathlib import Path

          assembly = Path("preflight/atomic-probe.s").read_text()
          forbidden = r"^\s*(?:ldadd\w*|ldclr\w*|ldeor\w*|ldset\w*|ldsmax\w*|ldsmin\w*|ldumax\w*|ldumin\w*|swp\w*|cas\w*)\s"
          assert not re.search(forbidden, assembly, re.M), "Preflight emitted an LSE atomic"
          assert "__aarch64_" not in assembly, "Preflight emitted outline atomic helpers"
          for instruction in ("ldxr", "stxr", "ldaxr", "stlxr"):
              assert re.search(r"^\s*" + instruction + r"\s", assembly, re.M), instruction
          print("PASS: Xcode emits inline ARMv8-A exclusive loops for all three atomic probes.")
          PY
          brew install gum xcodes
          for tool in jq gum xcodes cmake ninja python3; do
            command -v "$tool"
          done

      - name: Create and verify empty HFS RAM-root template
        shell: bash
        run: |
          set -euo pipefail
          cat > create-hfs-template.py <<'HFS_SOURCE'
          """macOS CI: build a checked HFS+ template containing ONLY placeholder bytes.
          Apple executable bytes are inserted later, locally on the user's Windows PC.
          """
          from pathlib import Path
          import fcntl,gzip,hashlib,json,os,struct,subprocess,sys
          def run(*args):return subprocess.run(args,check=True,stdout=subprocess.PIPE).stdout
          def main():
           assert sys.platform=='darwin' and os.geteuid()==0
           work=Path('hfs-template-work').resolve();work.mkdir(exist_ok=True)
           mount=work/'mount';mount.mkdir(exist_ok=True)
           image=work/'template.dmg';out=Path('hfs-template-out').resolve();out.mkdir(exist_ok=True)
           spec=json.loads(Path('hfs-template-files.json').read_text())
           # Sized blank images are read/write by default. -format is accepted for
           # source-based creation and conversion, not this empty-image invocation.
           run('hdiutil','create','-size','64m','-layout','NONE','-fs','Case-sensitive HFS+','-volname','X00TD_RAM',str(image))
           run('hdiutil','attach','-nobrowse','-owners','on','-mountpoint',str(mount),str(image))
           records=[]
           try:
            dirs=['dev','bin','sbin','apple/sbin','usr/lib/system','private/etc','private/var/run','private/var/db','private/var/log','private/var/tmp','System/Library/LaunchDaemons','System/Library/xpc','System/Library/CoreServices','cores']
            for name in dirs:(mount/name).mkdir(parents=True,exist_ok=True)
            for name,target in [('var','private/var'),('etc','private/etc'),('tmp','private/var/tmp')]:os.symlink(target,mount/name)
            os.chmod(mount/'private/var/tmp',0o1777)
            for item in spec:
             name=item['path'];size=item['bytes'];assert name.startswith('/') and '..' not in Path(name).parts and size>0
             p=mount/name.lstrip('/');p.parent.mkdir(exist_ok=True,parents=True)
             with p.open('wb') as f:
              remaining=size
              while remaining:
               n=min(65536,remaining);f.write(b'\xa5'*n);remaining-=n
              f.flush();os.fsync(f.fileno())
             os.chmod(p,item.get('mode',0o755));os.chown(p,0,0)
            os.sync()
            for item in spec:
             p=mount/item['path'].lstrip('/');size=item['bytes'];at=0;extents=[]
             with p.open('rb') as f:
              while at<size:
               # Darwin F_LOG2PHYS_EXT=65; struct log2phys has #pragma pack(4).
               data=fcntl.fcntl(f.fileno(),65,struct.pack('<Iqq',0,size-at,at))
               flags,contiguous,device_offset=struct.unpack('<Iqq',data)
               assert contiguous>0 and device_offset>=0
               n=min(contiguous,size-at);extents.append(dict(file_offset=at,device_offset=device_offset,bytes=n));at+=n
             records.append(dict(path=item['path'],bytes=size,extents=extents))
            run('diskutil','verifyVolume',str(mount))
           finally:run('hdiutil','detach',str(mount))
           run('hdiutil','convert',str(image),'-format','UDTO','-o',str(work/'raw'))
           raw=(work/'raw.cdr').read_bytes()
           assert raw[1024:1026] in (b'H+',b'HX'),'Expected unpartitioned HFS+ at volume offset zero'
           block,total=struct.unpack_from('>II',raw,1064);volume_bytes=block*total
           assert block==4096 and volume_bytes==64*1024*1024 and volume_bytes<=len(raw)
           attributes=struct.unpack_from('>I',raw,1028)[0]
           assert attributes & (1<<8),'Expected a cleanly unmounted template'
           assert not attributes & (1<<13),'Local file insertion requires a non-journaled template'
           raw=raw[:volume_bytes];ranges=[]
           for item in records:
            for e in item['extents']:
             off,n=e['device_offset'],e['bytes'];assert 0<=off<=len(raw)-n
             assert raw[off:off+n]==b'\xa5'*n,'Physical file mapping did not match placeholder bytes'
             ranges.append((off,off+n))
           ranges.sort();assert all(a[1]<=b[0] for a,b in zip(ranges,ranges[1:]))
           (out/'ramroot-template.img.gz').write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
           report=dict(format='HFS+ case-sensitive; raw; no partition table',block_bytes=block,image_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),contains_apple_executable_bytes=False,placeholder_byte=165,files=records,validation=['macOS diskutil verifyVolume','all physical file extents match allocated placeholder bytes','non-overlapping extents','HFS volume header bounds'])
           (out/'FILE_MAP.json').write_text(json.dumps(report,indent=2)+'\n')
           print('PASS: clean, verified placeholder HFS+ template; no Apple code uploaded')
          if __name__=='__main__':main()
          HFS_SOURCE
          cat > hfs-template-files.json <<'HFS_FILES'
          [
            {
              "path": "/bin/expr",
