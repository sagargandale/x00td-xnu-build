          root = Path(__file__).resolve().parent
          output = root.parent / "preflight"
          output.mkdir(exist_ok=True)
          zones = (root / "xnu/osfmk/kern/zalloc.c").read_text(encoding="utf-8")
          assert "#if XNU_PLATFORM_MacOSX && !defined(ARM64_BOARD_CONFIG_SWEET)\n#define ZONE_MAP_MAX" in zones, "Missing compact zone-map patch"
          copyio = (root / "xnu/osfmk/arm64/copyio.c").read_text()
          helpers = re.findall(
              r"static inline void\s+user_access_(?:enable|disable)\(void\)\s*\{.*?\n\}",
              copyio, re.S,
