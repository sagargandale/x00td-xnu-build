              "lse_disabled": True,
              "hardware_pan": False,
              "commpage_baseline_atomics": True,
              "persistent_console": True,
              "zone_map_va_bytes": 24 << 30,
              "zone_map_max_bytes": 8 << 30,
              "translation_page_bytes": 4096,
          }
          Path("out/BUILD_INFO.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
          (cd out && shasum -a 256 kernel.development.sweet > SHA256SUMS)

      - name: Compress the build log
        if: always()
        shell: bash
        run: |
          if [ -f x00td-build.log ]; then
            gzip -f x00td-build.log
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x00td-zone-map-build-diagnostics
          path: |
            preflight/
            x00td-build.log.gz
            dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the kernel and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x00td-xnu-zone-map-kernel
          path: out/
          if-no-files-found: error
          retention-days: 14

